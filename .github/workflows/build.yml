name: Build Shadows of Eldoria APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install Dependencies
        run: npm install

      - name: Generate Native App Icons
        run: |
          if [ -f resources/icon.png ]; then
            npx @capacitor/assets generate --assetPath resources --android || true
          else
            echo "No resources/icon.png — skipping icons"
          fi

      - name: Initialize Android Platform
        run: |
          npx cap add android || true
          npx cap copy android

      - name: Patch AndroidManifest for Meta Quest VR
        run: |
          python3 << 'PY'
          from pathlib import Path
          import re

          p = Path("android/app/src/main/AndroidManifest.xml")
          if not p.exists():
              raise SystemExit("AndroidManifest.xml not found — cap add failed")

          t = p.read_text(encoding="utf-8")

          # 1) headtracking feature (required for Quest store / VR)
          if "android.hardware.vr.headtracking" not in t:
              t = t.replace(
                  "<application",
                  '''    <uses-feature android:name="android.hardware.vr.headtracking" android:required="true" android:version="1" />
      <uses-feature android:name="android.hardware.vulkan.level" android:required="false" />
      <application''',
                  1,
              )

          # 2) Oculus meta-data inside <application>
          if "com.oculus.supportedDevices" not in t:
              t = re.sub(
                  r"(<application[^>]*>)",
                  r'''\1
              <meta-data android:name="com.oculus.supportedDevices" android:value="quest2|questpro|quest3|quest3s" />
              <meta-data android:name="com.oculus.vr.focusaware" android:value="true" />''',
                  t,
                  count=1,
              )

          # 3) VR category on launcher activity (THIS makes it immersive, not a panel)
          if "com.oculus.intent.category.VR" not in t:
              t = t.replace(
                  '<category android:name="android.intent.category.LAUNCHER" />',
                  '''<category android:name="android.intent.category.LAUNCHER" />
                  <category android:name="com.oculus.intent.category.VR" />''',
              )

          # 4) Activity attributes for VR comfort
          # theme
          if "Theme.Black.NoTitleBar.Fullscreen" not in t:
              t = re.sub(
                  r'android:theme="[^"]*"',
                  'android:theme="@android:style/Theme.Black.NoTitleBar.Fullscreen"',
                  t,
                  count=1,
              )
          # screenOrientation
          if "android:screenOrientation=" not in t:
              t = t.replace(
                  "<activity",
                  '<activity android:screenOrientation="landscape"',
                  1,
              )
          # configChanges (merge if missing pieces)
          if 'android:configChanges="' in t and "uiMode" not in t:
              t = re.sub(
                  r'android:configChanges="[^"]*"',
                  'android:configChanges="density|keyboard|keyboardHidden|navigation|orientation|screenLayout|screenSize|uiMode"',
                  t,
                  count=1,
              )
          # launchMode
          if "android:launchMode=" not in t:
              t = t.replace(
                  "<activity",
                  '<activity android:launchMode="singleTask"',
                  1,
              )
          # resizeableActivity
          if "android:resizeableActivity=" not in t:
              t = t.replace(
                  "<activity",
                  '<activity android:resizeableActivity="false"',
                  1,
              )

          p.write_text(t, encoding="utf-8")
          print("=== Patched AndroidManifest.xml ===")
          print(p.read_text(encoding="utf-8"))
          PY

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: shadows-of-eldoria-apk-${{ github.sha }}
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
